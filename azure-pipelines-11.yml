# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '4c1be8c7-6bb6-4fd9-8c4c-4c086a141fd5'
  imageRepository: 'gaurvssrisautomationcode'
  containerRegistry: 'dockermulti.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/My-App/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  Name: 'Agent15Apr'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
