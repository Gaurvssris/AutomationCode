<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bollywood Vibes 🔥</title>

<style>
/* 🌈 Full screen setup */
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100vh;
  background: black;
  font-family: Arial;
}

/* 🌟 Animated background stars */
.stars {
  width: 100%;
  height: 100%;
  position: absolute;
  background: url('https://i.imgur.com/3ZQ3ZQy.png');
  animation: moveStars 20s linear infinite;
  opacity: 0.4;
}

@keyframes moveStars {
  from {transform: translateY(0);}
  to {transform: translateY(-1000px);}
}

/* 💃 Main title */
.title {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  font-size: 70px;
  color: #ff0055;
  text-shadow: 0 0 20px #ff0055, 0 0 40px yellow;
  animation: glow 1.5s infinite alternate;
}

/* ✨ Glow animation */
@keyframes glow {
  from {transform: scale(1); opacity: 0.8;}
  to {transform: scale(1.1); opacity: 1;}
}

/* 🎬 Subtitle */
.subtitle {
  position: absolute;
  top: 55%;
  width: 100%;
  text-align: center;
  font-size: 25px;
  color: white;
  letter-spacing: 3px;
}

/* 💥 Floating Bollywood emojis */
.floating {
  position: absolute;
  font-size: 40px;
  animation: floatUp 6s infinite linear;
  opacity: 0.7;
}

@keyframes floatUp {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="title">🎬 Bollywood Vibes 🔥</div>
<div class="subtitle">Dance 💃 • Music 🎶 • Drama 🎭 • Fun 😎</div>

<!-- 💃 Floating emojis -->
<div class="floating" style="left:10%">💃</div>
<div class="floating" style="left:30%">🎬</div>
<div class="floating" style="left:50%">🔥</div>
<div class="floating" style="left:70%">🎶</div>
<div class="floating" style="left:90%">💥</div>

<script>
// random floating speed effect
document.querySelectorAll('.floating').forEach(el => {
  el.style.animationDuration = (3 + Math.random() * 5) + "s";
});
</script>

</body>
</html>
