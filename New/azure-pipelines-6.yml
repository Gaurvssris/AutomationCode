

trigger:
- main

stages:

# 🔹 DEV Stage
- stage: DEV
  displayName: Dev Environment Deployment

  jobs:
  - job: Terraform_Dev
    displayName: Terraform Init - DEV

    pool:
      name: Additionalagent

    steps:

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Dev'
        backendServiceArm: 'bilkulnew'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'
        backendAzureRmKey: 'backup.tfstate'
 # 🔹 PROD Stage
- stage: PROD
  displayName: Production Deployment

  jobs:
  - job: Terraform_Prod
    displayName: Terraform Init - PROD

    pool:
      name: Additionalagent

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Prod'
        backendServiceArm: 'bilkulnew'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'
        backendAzureRmKey: 'backup.tfstate'       
 # 🔹 QA Stage
- stage: QA
  displayName: QA Deployment

  jobs:
  - job: Terraform_QA
    displayName: Terraform Init - QA

    pool:
      name: Additionalagent

    steps:        
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/QA'
        backendServiceArm: 'bilkulnew'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'
        backendAzureRmKey: 'backup.tfstate'       