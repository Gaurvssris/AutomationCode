<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Wallpaper</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial;
        color: white;
        text-align: center;
    }

    /* Gradient Background Animation */
    body {
        background: linear-gradient(-45deg, #1e3c72, #2a5298, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
        position: absolute;
        top: 40%;
        width: 100%;
        font-size: 40px;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }
</style>

</head>
<body>

<h1 id="text"></h1>
<canvas id="canvas"></canvas>

<script>
    // Typing Effect
    let text = "Welcome to Docker Animated App 🚀";
    let i = 0;

    function typing() {
        if (i < text.length) {
            document.getElementById("text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 80);
        }
    }
    typing();

    // Particle Animation
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3,
            dx: (Math.random() - 0.5),
            dy: (Math.random() - 0.5)
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();

            p.x += p.dx;
            p.y += p.dy;

            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html> -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Frontend Website</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
    }

    body {
        background: #0f172a;
        color: white;
    }

    /* Navbar */
    nav {
        display: flex;
        justify-content: space-between;
        padding: 20px 50px;
        background: rgba(0,0,0,0.5);
        position: sticky;
        top: 0;
    }

    nav h2 {
        color: #38bdf8;
    }

    nav a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
    }

    nav a:hover {
        color: #38bdf8;
    }

    /* Hero Section */
    .hero {
        height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: linear-gradient(135deg, #1e3a8a, #9333ea);
        text-align: center;
    }

    .hero h1 {
        font-size: 60px;
        margin-bottom: 20px;
    }

    .hero p {
        font-size: 20px;
        margin-bottom: 20px;
    }

    .hero button {
        padding: 12px 25px;
        border: none;
        background: #38bdf8;
        color: black;
        cursor: pointer;
        border-radius: 5px;
    }

    /* Cards Section */
    .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 50px;
    }

    .card {
        background: #1e293b;
        padding: 20px;
        width: 250px;
        border-radius: 10px;
        transition: 0.3s;
        text-align: center;
    }

    .card:hover {
        transform: translateY(-10px);
        background: #334155;
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 20px;
        background: black;
    }
</style>

</head>
<body>

<!-- Navbar -->
<nav>
    <h2>🚀 DevOps App</h2>
    <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
</nav>

<!-- Hero Section -->
<div class="hero">
    <h1>Welcome Boss 😎</h1>
    <p>Docker + NGINX Hosted Frontend Website</p>
    <button onclick="showMessage()">Click Me</button>
</div>

<!-- Cards -->
<div class="cards">
    <div class="card">
        <h3>Docker</h3>
        <p>Containerization platform</p>
    </div>

    <div class="card">
        <h3>Kubernetes</h3>
        <p>Container orchestration</p>
    </div>

    <div class="card">
        <h3>Azure</h3>
        <p>Cloud platform</p>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>© 2026 DevOps Website</p>
</footer>

<script>
function showMessage() {
    alert("🔥 Welcome to your Pro Website!");
}
</script>

</body>
</html>
