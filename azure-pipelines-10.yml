trigger:
- main

stages:

# ================= DEV =================
- stage: DEV
  displayName: "DEV - DevSecOps + Terraform Init"

  jobs:
  - job: DEV_JOB
    pool:
      name: 'Agent15Apr'

    steps:

    # 🔹 Install Terraform
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.10.5'

    # 🔹 Install TFLint (Windows)
    - powershell: |
        Invoke-WebRequest -Uri https://github.com/terraform-linters/tflint/releases/latest/download/tflint_windows_amd64.zip -OutFile tflint.zip
        Expand-Archive tflint.zip -DestinationPath $(Build.SourcesDirectory)
      displayName: "Install TFLint"

    # 🔹 Run TFLint
    - powershell: |
        cd $(Build.SourcesDirectory)
        .\tflint.exe --init
        .\tflint.exe .\Root\Dev
      displayName: "Run TFLint"

    # 🔹 Install tfsec (Windows)
    - powershell: |
        Invoke-WebRequest -Uri https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-windows-amd64.exe -OutFile $(Build.SourcesDirectory)\tfsec.exe
      displayName: "Install tfsec"

    # 🔹 Run tfsec
    - powershell: |
        cd $(Build.SourcesDirectory)
        .\tfsec.exe .\Root\Dev
      displayName: "Run tfsec"

    # 🔹 Install Checkov
    - powershell: |
        pip install --upgrade pip
        pip install checkov
      displayName: "Install Checkov"

    # 🔹 Run Checkov
    - powershell: |
        checkov -d $(Build.SourcesDirectory)\Root\Dev
      displayName: "Run Checkov"

    # 🔹 Terraform Init
    - task: TerraformTask@5
      displayName: "Terraform Init - DEV"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(Build.SourcesDirectory)/Root/Dev'
        backendServiceArm: 'awesome'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'
        backendAzureRmKey: 'dev.tfstate'