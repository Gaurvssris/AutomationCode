trigger:
- main

pool:
  name: Agent29

# ======================================
# STAGES START
# ======================================

stages:

# ======================================
# DEV STAGE
# ======================================
- stage: DEV
  displayName: DEV Stage

  jobs:
  - job: Terraform_Init_DEV
    displayName: Terraform Init DEV

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init DEV
      inputs:
        provider: 'azurerm'
        command: 'init'

        # DEV Folder
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Dev'

        # Service Connection
        backendServiceArm: 'newSCconnection'

        # Backend Storage
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'

        # DEV tfstate
        backendAzureRmKey: 'dev.tfstate'


# ======================================
# QA STAGE
# ======================================
- stage: QA
  displayName: QA Stage

  dependsOn: DEV

  jobs:
  - job: Terraform_Init_QA
    displayName: Terraform Init QA

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init QA
      inputs:
        provider: 'azurerm'
        command: 'init'

        # QA Folder
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/QA'

        # Service Connection
        backendServiceArm: 'newSCconnection'

        # Backend Storage
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'

        # QA tfstate
        backendAzureRmKey: 'qa.tfstate'


# ======================================
# PROD STAGE
# ======================================
- stage: PROD
  displayName: PROD Stage

  dependsOn: QA

  jobs:
  - job: Terraform_Init_PROD
    displayName: Terraform Init PROD

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init PROD
      inputs:
        provider: 'azurerm'
        command: 'init'

        # PROD Folder
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Prod'

        # Service Connection
        backendServiceArm: 'newSCconnection'

        # Backend Storage
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'gauravbackuptfstate'

        # PROD tfstate
        backendAzureRmKey: 'prod.tfstate'
