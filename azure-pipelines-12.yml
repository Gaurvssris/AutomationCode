trigger:
- main

stages:

# ================= DEV =================
- stage: DEV
  displayName: Dev Stage
  jobs:
  - job: Dev_Job
    pool:
      name: Agent15Apr

    steps:

    # Install TFLint Only
    - script: |
        echo "Installing TFLint"
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

        echo "Verify TFLint"
        tflint --version
      displayName: Install TFLint

    # Run TFLint
    - script: |
        tflint --init
        tflint
      workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Dev'
      displayName: TFLint Scan

    # Terraform Init
    - task: TerraformTask@5
      displayName: Terraform Init Dev
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Dev'
        backendServiceArm: 'automation'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'tfstate-dev'
        backendAzureRmKey: 'dev.tfstate'


# ================= QA =================
- stage: QA
  displayName: QA Stage
  dependsOn: DEV
  condition: succeeded()

  jobs:
  - job: QA_Job
    pool:
      name: Agent15Apr

    steps:

    - script: |
        echo "Installing TFLint"
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      displayName: Install TFLint

    - script: |
        tflint --init
        tflint
      workingDirectory: '$(System.DefaultWorkingDirectory)/Root/QA'
      displayName: TFLint Scan

    - task: TerraformTask@5
      displayName: Terraform Init QA
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/QA'
        backendServiceArm: 'automation'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'tfstate-qa'
        backendAzureRmKey: 'qa.tfstate'


# ================= PROD =================
- stage: PROD
  displayName: Production Stage
  dependsOn: QA
  condition: succeeded()

  jobs:
  - job: PROD_Job
    pool:
      name: Agent15Apr

    steps:

    - script: |
        echo "Installing TFLint"
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      displayName: Install TFLint

    - script: |
        tflint --init
        tflint
      workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Prod'
      displayName: TFLint Scan

    - task: TerraformTask@5
      displayName: Terraform Init Prod
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Root/Prod'
        backendServiceArm: 'automation'
        backendAzureRmStorageAccountName: 'storagegauravssris'
        backendAzureRmContainerName: 'tfstate-prod'
        backendAzureRmKey: 'prod.tfstate'